server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Les appels API sont relayes vers la passerelle : le navigateur ne dialogue
    # qu'avec une seule origine, ce qui evite toute question de CORS en production.
    location /api/ {
        # Resolveur DNS interne de Docker, avec une duree de validite courte.
        #
        # Indispensable : avec un nom d'hote ecrit en dur dans proxy_pass, nginx ne
        # le resout QU'UNE FOIS, au demarrage, et conserve l'adresse indefiniment.
        # Des que le conteneur gateway est recree il change d'IP, et nginx continue
        # d'appeler l'ancienne -- d'ou des 502 "Connection refused" permanents.
        # Passer par une variable force une nouvelle resolution a chaque requete.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway_host gateway;

        proxy_pass         http://$gateway_host:8222$request_uri;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Application monopage : toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
