server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Les appels API sont relayes vers la passerelle : le navigateur ne dialogue
    # qu'avec une seule origine, ce qui evite toute question de CORS en production.
    location /api/ {
        proxy_pass         http://gateway:8222;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Application monopage : toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
