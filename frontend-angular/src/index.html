<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Gestion de Stock</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plateforme de gestion de stock : produits, categories, fournisseurs, mouvements, clients, commandes et paiements.">

  <script>
    (function() {
      try {
        var saved = localStorage.getItem('ds-theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
      } catch(e) {}
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="favicon.svg">

  <!-- Couleur de la barre du navigateur, alignee sur la primaire de DESIGN.md.
       Une valeur par theme pour que la barre suive le mode clair ou sombre. -->
  <meta name="theme-color" content="#1D4ED8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">

  <meta property="og:title" content="Gestion de Stock">
  <meta property="og:description" content="Application de gestion de stock">
  <meta property="og:image" content="assets/logo-full.svg">
</head>
<body>
<app-root></app-root>
</body>
</html>
