<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-circle">
        <app-icon name="user" [size]="36"></app-icon>
      </div>
      <h1>Créer un compte</h1>
      <p class="subtitle">Rejoignez la plateforme de gestion de stock</p>
    </div>

    <form (ngSubmit)="inscrire()">

      <div class="form-row">
        <div class="form-group">
          <label>Nom d'utilisateur</label>
          <div class="input-wrapper">
            <app-icon name="key" [size]="18" class="input-icon"></app-icon>
            <input [(ngModel)]="username" name="username"
                   placeholder="jean.dupont"
                   required minlength="3" autocomplete="off" />
          </div>
        </div>

        <div class="form-group">
          <label>Nom complet</label>
          <div class="input-wrapper">
            <app-icon name="user" [size]="18" class="input-icon"></app-icon>
            <input [(ngModel)]="nome" name="nome"
                   placeholder="Jean Dupont"
                   required />
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <div class="input-wrapper">
          <app-icon name="mail" [size]="18" class="input-icon"></app-icon>
          <input [(ngModel)]="email" name="email" type="email"
                 placeholder="jean@estoque.com"
                 required autocomplete="email" />
        </div>
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <div class="input-wrapper">
          <app-icon name="lock" [size]="18" class="input-icon"></app-icon>
          <input [(ngModel)]="password" name="password"
                 [type]="showPassword ? 'text' : 'password'"
                 placeholder="6 caractères minimum"
                 required minlength="6" autocomplete="new-password" />
          <button type="button" class="toggle-pwd" (click)="showPassword = !showPassword">
            <app-icon [name]="showPassword ? 'eyeOff' : 'eye'" [size]="18"></app-icon>
          </button>
        </div>

        <div class="pwd-strength" *ngIf="password">
          <div class="pwd-strength-bar" [class]="forceMotDePasse"></div>
          <div class="pwd-strength-bar"
               [class]="forceMotDePasse === 'moyen' || forceMotDePasse === 'fort' ? forceMotDePasse : ''"></div>
          <div class="pwd-strength-bar"
               [class]="forceMotDePasse === 'fort' ? 'fort' : ''"></div>
        </div>

        <p class="pwd-strength-label" [class]="forceMotDePasse" *ngIf="password">
          Force : {{ forceMotDePasse }}
        </p>
      </div>

      <div class="form-group">
        <label>Confirmer le mot de passe</label>
        <div class="input-wrapper">
          <app-icon name="check" [size]="18" class="input-icon"></app-icon>
          <input [(ngModel)]="confirmPassword" name="confirmPassword"
                 [type]="showPassword ? 'text' : 'password'"
                 placeholder="Retaper le mot de passe"
                 required autocomplete="new-password" />
        </div>
      </div>

      <div class="form-group">
        <label>Rôle souhaité</label>
        <div class="roles-grid">
          <label *ngFor="let r of roles"
                 class="role-option"
                 [style.--role-color]="r.color"
                 [class.selected]="role === r.value">
            <input type="radio" name="role" [value]="r.value" [(ngModel)]="role" hidden />
            <app-icon [name]="r.icon" [size]="18"></app-icon>
            <span class="role-label">{{ r.label }}</span>
          </label>
        </div>
      </div>

      <p *ngIf="erro" class="erro">
        <app-icon name="alert" [size]="16"></app-icon>
        <span>{{ erro }}</span>
      </p>

      <p *ngIf="success" class="msg-success">
        <app-icon name="check" [size]="16"></app-icon>
        <span>{{ success }}</span>
      </p>

      <button type="submit" class="btn-login" [disabled]="loading">
        <app-icon name="save" [size]="18"></app-icon>
        <span>{{ loading ? 'Création...' : 'Créer mon compte' }}</span>
      </button>

    </form>

    <div class="login-footer">
      <a routerLink="/login" class="back-link">
        <app-icon name="login" [size]="16"></app-icon>
        <span>Déjà un compte ? Se connecter</span>
      </a>
    </div>
  </div>
</div>
