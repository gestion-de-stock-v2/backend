<h2>Catégories</h2>

<form #formCat="ngForm" (ngSubmit)="formCat.valid && salvar()" class="form">
  <input
    [(ngModel)]="nova.nome"
    name="nome"
    placeholder="Nom de la catégorie"
    required
    minlength="2"
    #nome="ngModel" />
  <span class="hint" *ngIf="nome.invalid && nome.touched">Nom obligatoire</span>

  <button type="submit" [disabled]="formCat.invalid">
    {{ editandoId ? 'Mettre à jour' : 'Ajouter' }}
  </button>
  <button type="button" *ngIf="editandoId" (click)="cancelar()">Annuler</button>
</form>

<p *ngIf="erro" class="erro">{{ erro }}</p>

<table class="table">
  <thead>
    <tr><th>ID</th><th>Nom</th><th>Actions</th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let c of categorias">
      <td>{{ c.id }}</td>
      <td>{{ c.nome }}</td>
      <td>
        <button (click)="editar(c)">Éditer</button>
        <button (click)="excluir(c.id!)">Supprimer</button>
      </td>
    </tr>
    <tr *ngIf="categorias.length === 0"><td colspan="3">Aucune catégorie</td></tr>
  </tbody>
</table>
