<h2>Catégories</h2>

<form #formCat="ngForm" (ngSubmit)="formCat.valid && save()" class="form">
  <input
    [(ngModel)]="draft.name"
    name="name"
    placeholder="Nom de la catégorie"
    required
    minlength="2"
    #name="ngModel" />
  <span class="hint" *ngIf="name.invalid && name.touched">Nom obligatoire</span>

  <input [(ngModel)]="draft.description" name="description" placeholder="Description" />

  <button type="submit" [disabled]="formCat.invalid">
    {{ editingId ? 'Mettre à jour' : 'Ajouter' }}
  </button>
  <button type="button" *ngIf="editingId" (click)="cancel()">Annuler</button>
</form>

<p *ngIf="error" class="erro">{{ error }}</p>

<div class="table-wrap">
<table class="table">
  <thead>
    <tr><th>ID</th><th>Nom</th><th>Description</th><th>Actions</th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let c of categories">
      <td>{{ c.id }}</td>
      <td>{{ c.name }}</td>
      <td>{{ c.description }}</td>
      <td>
        <button (click)="edit(c)">Éditer</button>
        <button (click)="remove(c.id!)">Supprimer</button>
      </td>
    </tr>
    <tr *ngIf="categories.length === 0"><td colspan="4">Aucune catégorie</td></tr>
  </tbody>
</table>
</div>
