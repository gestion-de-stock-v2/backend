<div class="customers-page">
  <div class="page-header">
    <div class="page-title">
      <app-icon name="users" [size]="28"></app-icon>
      <div><h2>Clients</h2><p>Référentiel clients</p></div>
    </div>
    <button class="btn-primary" (click)="toggleForm()">
      <app-icon [name]="showForm ? 'close' : 'plus'" [size]="18"></app-icon>
      <span>{{ showForm ? 'Annuler' : 'Nouveau client' }}</span>
    </button>
  </div>

  <div class="form-card" *ngIf="showForm">
    <div class="card-header"><app-icon name="user" [size]="20"></app-icon><h3>{{ editandoId ? 'Modifier' : 'Créer' }} un client</h3></div>
    <form (ngSubmit)="salvar()" class="user-form">
      <div class="form-row">
        <div class="form-group"><label>Prénom</label><input [(ngModel)]="novo.firstname" name="firstname" required /></div>
        <div class="form-group"><label>Nom</label><input [(ngModel)]="novo.lastname" name="lastname" required /></div>
      </div>
      <div class="form-group"><label>Email</label><input [(ngModel)]="novo.email" name="email" type="email" required /></div>
      <div class="form-group"><label>Adresse</label><input [(ngModel)]="novo.address" name="address" /></div>
      <p *ngIf="erro" class="msg-error">{{ erro }}</p>
      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="toggleForm()">Annuler</button>
        <button type="submit" class="btn-primary" [disabled]="loading">{{ loading ? 'Enregistrement...' : 'Enregistrer' }}</button>
      </div>
    </form>
  </div>

  <div class="card">
    <div class="card-header"><app-icon name="users" [size]="20"></app-icon><h3>Liste ({{ customers.length }})</h3></div>
    <table class="table">
      <thead><tr><th>ID</th><th>Prénom</th><th>Nom</th><th>Email</th><th>Adresse</th><th>Actions</th></tr></thead>
      <tbody>
      <tr *ngFor="let c of customers">
        <td>{{ c.id }}</td><td>{{ c.firstname }}</td><td>{{ c.lastname }}</td><td>{{ c.email }}</td><td>{{ c.address }}</td>
        <td class="actions-cell">
          <button class="btn-icon" (click)="editar(c)"><app-icon name="edit" [size]="16"></app-icon></button>
          <button class="btn-icon danger" (click)="excluir(c.id!)"><app-icon name="trash" [size]="16"></app-icon></button>
        </td>
      </tr>
      <tr *ngIf="customers.length === 0"><td colspan="6" class="empty-row">Aucun client</td></tr>
      </tbody>
    </table>
  </div>
</div>
