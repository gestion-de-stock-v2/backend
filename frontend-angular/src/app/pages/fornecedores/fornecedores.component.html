<h2>Fournisseurs</h2>

<form #formF="ngForm" (ngSubmit)="formF.valid && save()" class="form">
  <input [(ngModel)]="draft.name" name="name" placeholder="Nom *" required minlength="2" #name="ngModel" />
  <span class="hint" *ngIf="name.invalid && name.touched">Nom obligatoire</span>
  <input [(ngModel)]="draft.registrationNumber" name="registrationNumber" placeholder="N° d'immatriculation" />
  <input [(ngModel)]="draft.phone" name="phone" placeholder="Téléphone" />
  <input [(ngModel)]="draft.email" name="email" type="email" placeholder="Email" />
  <button type="submit" [disabled]="formF.invalid">{{ editingId ? 'Mettre à jour' : 'Ajouter' }}</button>
  <button type="button" *ngIf="editingId" (click)="cancel()">Annuler</button>
</form>

<p *ngIf="error" class="erro">{{ error }}</p>

<div class="table-wrap">
<table class="table">
  <thead>
    <tr><th>ID</th><th>Nom</th><th>N° immat.</th><th>Tél</th><th>Email</th><th>Actions</th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let s of suppliers">
      <td>{{ s.id }}</td>
      <td>{{ s.name }}</td>
      <td>{{ s.registrationNumber }}</td>
      <td>{{ s.phone }}</td>
      <td>{{ s.email }}</td>
      <td>
        <button (click)="edit(s)">Éditer</button>
        <button (click)="remove(s.id!)">Supprimer</button>
      </td>
    </tr>
    <tr *ngIf="suppliers.length === 0"><td colspan="6">Aucun fournisseur</td></tr>
  </tbody>
</table>
</div>
