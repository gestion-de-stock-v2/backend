<h2>
  <app-icon name="exchange" [size]="24" />
  Mouvements de stock
</h2>

<form class="form">
  <label>Produit
    <select [(ngModel)]="selectedProductId" name="product" (ngModelChange)="load()">
      <option *ngFor="let p of products" [ngValue]="p.id">
        {{ p.name }} — stock : {{ p.availableQuantity }}
      </option>
    </select>
  </label>
</form>

<form (ngSubmit)="save()" class="form">
  <label>Type
    <select [(ngModel)]="type" name="type">
      <option value="ENTRY">Entrée</option>
      <option value="EXIT">Sortie</option>
    </select>
  </label>
  <label>Quantité <input [(ngModel)]="quantity" name="quantity" type="number" min="1" /></label>
  <label>Observation <input [(ngModel)]="note" name="note" /></label>
  <button type="submit">
    <app-icon name="check" [size]="16" /> Enregistrer
  </button>
</form>

<p *ngIf="error" class="erro">{{ error }}</p>

<table class="table">
  <thead>
    <tr><th>ID</th><th>Type</th><th>Quantité</th><th>Observation</th><th>Stock après</th><th>Date</th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let m of movements">
      <td>{{ m.id }}</td>
      <td>
        <span class="badge" [class.entrada]="m.type === 'ENTRY'" [class.saida]="m.type === 'EXIT'">
          {{ m.type === 'ENTRY' ? 'Entrée' : 'Sortie' }}
        </span>
      </td>
      <td>{{ m.quantity }}</td>
      <td>{{ m.note }}</td>
      <td>{{ m.availableQuantityAfter }}</td>
      <td>{{ m.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
    </tr>
    <tr *ngIf="movements.length === 0">
      <td colspan="6" style="text-align:center; color:#9CA3AF; padding:32px">Aucun mouvement</td>
    </tr>
  </tbody>
</table>
