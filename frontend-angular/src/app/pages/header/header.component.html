<aside class="app-sidebar" id="app-sidebar">

  <!-- Marque -->
  <a routerLink="/dashboard" class="brand">
    <svg class="brand-logo" viewBox="0 0 48 48" width="34" height="34" aria-hidden="true"
         xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="4" width="40" height="40" rx="12" fill="currentColor"/>
      <path d="M14 20 L24 15 L34 20 L34 30 L24 35 L14 30 Z" fill="none" stroke="#fff"
            stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M14 20 L24 25 L34 20" fill="none" stroke="#fff" stroke-width="2.5"
            stroke-linejoin="round"/>
      <line x1="24" y1="25" x2="24" y2="35" stroke="#fff" stroke-width="2.5"/>
    </svg>
    <span class="brand-text">
      <span class="brand-title">Gestion</span>
      <span class="brand-sub">de Stock</span>
    </span>
  </a>

  <!-- Profil -->
  <a routerLink="/profile" class="user-chip" *ngIf="auth.currentUser() as u"
     [style.--role-color]="getRoleColor(u.role)">
    <span class="user-avatar"><app-icon name="user" [size]="18" /></span>
    <span class="user-text">
      <span class="name">{{ u.name }}</span>
      <span class="role">{{ u.role }}</span>
    </span>
  </a>

  <!-- Navigation -->
  <nav class="sidebar-nav" aria-label="Navigation principale">
    <a *ngFor="let item of visibleNav"
       [routerLink]="item.path" routerLinkActive="active">
      <app-icon [name]="item.icon" [size]="18" />
      <span>{{ item.label }}</span>
    </a>
  </nav>

  <!-- Déconnexion : dernier élément du menu -->
  <button type="button" class="logout-btn" (click)="auth.logout()">
    <app-icon name="logout" [size]="18" />
    <span>Déconnexion</span>
  </button>

</aside>
