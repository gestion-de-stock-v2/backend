<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-circle">
        <app-icon name="lock" [size]="36"></app-icon>
      </div>
      <h1>Mot de passe oublié</h1>
      <p class="subtitle">Entrez votre email pour recevoir un lien de réinitialisation</p>
    </div>

    <form *ngIf="!sent" (ngSubmit)="envoyer()">
      <div class="form-group">
        <label>Adresse email</label>
        <div class="input-wrapper">
          <app-icon name="mail" [size]="18" class="input-icon"></app-icon>
          <input [(ngModel)]="email" name="email" type="email"
                 placeholder="admin@estoque.com" required autocomplete="email" />
        </div>
      </div>

      <p *ngIf="erro" class="erro">
        <app-icon name="alert" [size]="16"></app-icon>
        <span>{{ erro }}</span>
      </p>

      <button type="submit" class="btn-login" [disabled]="loading">
        <app-icon name="mail" [size]="18"></app-icon>
        <span>{{ loading ? 'Envoi...' : 'Envoyer le lien' }}</span>
      </button>
    </form>

    <div *ngIf="sent" class="success-block">
      <div class="success-icon">
        <app-icon name="check" [size]="28"></app-icon>
      </div>
      <p>Si un compte existe avec cet email, vous recevrez un lien de réinitialisation.</p>

      <div *ngIf="devLink" class="dev-info">
        <p><strong>Mode démonstration</strong></p>
        <p>Le lien a été affiché dans la console du backend.</p>
        <a [href]="devLink" class="dev-link">
          <app-icon name="key" [size]="16"></app-icon>
          <span>Réinitialiser maintenant</span>
        </a>
      </div>
    </div>

    <div class="login-footer">
      <a routerLink="/login" class="back-link">
        <app-icon name="login" [size]="16"></app-icon>
        <span>Retour à la connexion</span>
      </a>
    </div>
  </div>
</div>
