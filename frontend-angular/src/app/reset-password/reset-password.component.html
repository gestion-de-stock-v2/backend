<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-circle">
        <app-icon name="key" [size]="36"></app-icon>
      </div>
      <h1>Nouveau mot de passe</h1>
      <p class="subtitle">Choisissez un mot de passe sécurisé</p>
    </div>

    <form *ngIf="!done" (ngSubmit)="valider()">
      <div class="form-group">
        <label>Nouveau mot de passe</label>
        <div class="input-wrapper">
          <app-icon name="lock" [size]="18" class="input-icon"></app-icon>
          <input [(ngModel)]="newPassword" name="newPassword"
                 [type]="showPassword ? 'text' : 'password'"
                 placeholder="6 caractères minimum" required minlength="6" />
          <button type="button" class="toggle-pwd" (click)="showPassword = !showPassword">
            <app-icon [name]="showPassword ? 'eyeOff' : 'eye'" [size]="18"></app-icon>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label>Confirmer le mot de passe</label>
        <div class="input-wrapper">
          <app-icon name="lock" [size]="18" class="input-icon"></app-icon>
          <input [(ngModel)]="confirmPassword" name="confirmPassword"
                 [type]="showPassword ? 'text' : 'password'"
                 placeholder="Retaper le mot de passe" required />
        </div>
      </div>

      <p *ngIf="erro" class="erro">
        <app-icon name="alert" [size]="16"></app-icon>
        <span>{{ erro }}</span>
      </p>

      <button type="submit" class="btn-login" [disabled]="loading">
        <app-icon name="save" [size]="18"></app-icon>
        <span>{{ loading ? 'Enregistrement...' : 'Réinitialiser' }}</span>
      </button>
    </form>

    <div *ngIf="done" class="success-block">
      <div class="success-icon">
        <app-icon name="check" [size]="28"></app-icon>
      </div>
      <p>Votre mot de passe a été réinitialisé avec succès.</p>
      <p>Redirection vers la connexion...</p>
    </div>
    <div class="login-footer" *ngIf="!done">
      <a routerLink="/login" class="back-link">
        <app-icon name="login" [size]="16"></app-icon>
        <span>Retour à la connexion</span>
      </a>
    </div>
  </div>
</div>
